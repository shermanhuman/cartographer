# Reusable: build a workspace snapshot from the repos in cartographer.toml and
# publish it as a release of the calling (workspace) repository.
name: Build snapshot
on:
  workflow_call:
    inputs:
      cartographer-version:
        type: string
        default: latest
      workspace-path:
        description: Directory of cartographer.toml in the calling repository.
        type: string
        default: "."
      postgres-image:
        description: Database for schema `prepare` (only used on a schema cache miss).
        type: string
        default: postgres:18
    secrets:
      app-id:
        description: GitHub App id; with app-private-key, mints a token that can read every repository in the workspace.
        required: false
      app-private-key:
        required: false
      repo-token:
        description: "Alternative to the App: a token that can read every repository in the workspace. Defaults to github.token."
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HAS_APP: ${{ secrets.app-id != '' }}
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      CARTOGRAPHER_NO_PULL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          working_directory: ${{ inputs.workspace-path }}
      # The setup action follows the moving `v0` tag, which release.yml points
      # at each v0.x.y release. Pin this reusable workflow to a release tag
      # (…/build-snapshot.yml@v0.x.y) and set cartographer-version to match.
      - uses: shermanhuman/cartographer/action@v0
        with:
          version: ${{ inputs.cartographer-version }}
      # Schema cache: restore the newest entry for this workspace config; save
      # a new entry only when the cached files changed (key = their hash).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _cartographer-cache/cartographer/schema
          key: cartographer-schema-${{ hashFiles(format('{0}/cartographer.toml', inputs.workspace-path)) }}-
          restore-keys: cartographer-schema-${{ hashFiles(format('{0}/cartographer.toml', inputs.workspace-path)) }}-
      - name: Build
        working-directory: ${{ inputs.workspace-path }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.repo-token || github.token }}
          XDG_CACHE_HOME: ${{ github.workspace }}/_cartographer-cache
        run: cartographer build --fetch --out "$RUNNER_TEMP/snapshot"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && hashFiles('_cartographer-cache/cartographer/schema/*.json') != ''
        with:
          path: _cartographer-cache/cartographer/schema
          key: cartographer-schema-${{ hashFiles(format('{0}/cartographer.toml', inputs.workspace-path)) }}-${{ hashFiles('_cartographer-cache/cartographer/schema/*.json') }}
      - name: Publish
        working-directory: ${{ inputs.workspace-path }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cartographer publish "$RUNNER_TEMP/snapshot"
