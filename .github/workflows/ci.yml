name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...
      # The indexer tests (Go's GOOS pin, Rust's fresh index) skip without
      # scip-go and rust-analyzer; here they run, at the pins the
      # goldens were made with, and fail if a tool is missing.
      - name: Indexer tests
        env:
          CARTOGRAPHER_REQUIRE_INDEXERS: "1"
        run: mise exec github:scip-code/scip-go@0.2.9 aqua:rust-lang/rust-analyzer@2026-11-16 rust@1.99.1 -- go test -count=1 -run 'TestIndex' -v ./internal/scip
      - name: Elixir plugin tests
        run: |
          elixir plugins/extract-elixir/test/extract_test.exs
          elixir plugins/extract-postgres-schema/test/capture_test.exs
      - name: JavaScript plugin tests
        run: node --test plugins/extract-javascript/test/
